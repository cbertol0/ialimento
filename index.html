<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>5 Claves de la Inocuidad</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:sans-serif;
    background:#000;
}

.slider{
    display:flex;
    width:100%;
    height:100vh;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
}

.slider::-webkit-scrollbar{
    display:none;
}

.slide{
    flex:0 0 100%;
    width:100%;
    height:100vh;
    scroll-snap-align:start;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.indicator{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    background:rgba(0,0,0,.45);
    color:white;
    padding:8px 16px;
    border-radius:30px;
    font-size:14px;
    backdrop-filter:blur(10px);
}

.swipe{
    position:fixed;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:14px;
    opacity:.9;
    animation:pulse 1.8s infinite;
    z-index:100;
}

@keyframes pulse{
    0%{opacity:.3}
    50%{opacity:1}
    100%{opacity:.3}
}

</style>
</head>

<body>

<div class="swipe">
👉 Deslizá para continuar
</div>

<div class="indicator" id="counter">
1 / 6
</div>

<div class="slider" id="slider">

    <section class="slide">
        <img src="portada.png" alt="">
    </section>

    <section class="slide">
        <img src="mantenerlimpieza.png" alt="">
    </section>

    <section class="slide">
        <img src="separar.png" alt="">
    </section>

    <section class="slide">
        <img src="cocinarcompletamente.png" alt="">
    </section>

    <section class="slide">
        <img src="mantener.png" alt="">
    </section>

    <section class="slide">
        <img src="usaragua.png" alt="">
    </section>

</div>

<script>

const slider = document.getElementById('slider');
const counter = document.getElementById('counter');

slider.addEventListener('scroll', () => {

    const page =
        Math.round(
            slider.scrollLeft /
            window.innerWidth
        ) + 1;

    counter.textContent = page + ' / 6';

});

</script>

</body>
</html>
