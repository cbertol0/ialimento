<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instituto del Alimento</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}

.slider{
    display:flex;
    width:100%;
    height:100vh;

    overflow-x:auto;
    overflow-y:hidden;

    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;

    scrollbar-width:none;
}

.slider::-webkit-scrollbar{
    display:none;
}

.slide{
    flex:0 0 100%;
    width:100%;
    height:100vh;

    scroll-snap-align:start;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#000;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.indicator{
    position:fixed;
    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.55);
    color:white;

    padding:8px 16px;

    border-radius:30px;

    font-size:14px;

    z-index:1000;
}

.swipe{
    position:fixed;

    bottom:60px;
    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:14px;
    font-weight:bold;

    background:rgba(0,0,0,.45);

    padding:8px 14px;

    border-radius:30px;

    z-index:1000;

    animation:pulse 1.8s infinite;
}

@keyframes pulse{

    0%{
        opacity:.35;
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:.35;
    }

}

.whatsapp-btn{

    position:fixed;

    right:15px;
    bottom:15px;

    background:#25D366;
    color:white;

    text-decoration:none;

    padding:12px 18px;

    border-radius:50px;

    font-size:14px;
    font-weight:bold;

    box-shadow:0 4px 12px rgba(0,0,0,.35);

    z-index:9999;
}

.whatsapp-btn:hover{
    transform:scale(1.05);
}

</style>

</head>

<body>

<div class="swipe">
👉 Deslizá para continuar
</div>

<div class="indicator" id="counter">
1 / 6
</div>

<div class="slider" id="slider">

    <section class="slide">
        <img src="portada.png" alt="Portada">
    </section>

    <section class="slide">
        <img src="mantenerlimpieza.png" alt="Mantener la limpieza">
    </section>

    <section class="slide">
        <img src="separar.png" alt="Separar alimentos">
    </section>

    <section class="slide">
        <img src="cocinarcompletamente.png" alt="Cocinar completamente">
    </section>

    <section class="slide">
        <img src="mantener.png" alt="Temperaturas seguras">
    </section>

    <section class="slide">
        <img src="usaragua.png" alt="Usar agua segura">
    </section>

</div>

<a
href="https://whatsapp.com/channel/0029VbBgHsrFy72LKJ1xdt2n"
target="_blank"
class="whatsapp-btn">

📢 Canal WhatsApp

</a>

<script>

const slider = document.getElementById('slider');
const counter = document.getElementById('counter');
const swipe = document.querySelector('.swipe');

slider.addEventListener('scroll', () => {

    const page =
        Math.round(
            slider.scrollLeft /
            window.innerWidth
        ) + 1;

    counter.textContent = page + ' / 6';

    if(page > 1){
        swipe.style.display = 'none';
    }

});

</script>

</body>
</html>
